# Merge a release PR (dev -> main, merge commit): deploy dev's build to prod,
# then tag the next semantic version and publish a GitHub release listing every
# PR in it. Same scripts as bitbucket-pipelines.yml.
#   release-sha.sh   main's tip must be a merge from dev; prod gets dev's tip,
#                    the build dev already tested (built by the dev pipeline)
#   check-prod.sh    in _deploy.yml: the person who merged is in PROD_APPROVERS
#   next-version.sh  vX.Y.Z from the conventional PR titles since the last tag
#   release-notes.sh the build SHA and one line per PR
# The tag goes on only after prod is healthy, so a tag means "was in prod".
# Merge the release PR after the dev pipeline for dev's tip is green, or the
# prod job won't find the build.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      build_sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: sha
        run: |
          SHA="$(scripts/ci/release-sha.sh "$GITHUB_SHA")"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
  prod:
    needs: verify
    uses: ./.github/workflows/_deploy.yml
    with:
      env: prod
      build_sha: ${{ needs.verify.outputs.build_sha }}
  release:
    needs: prod
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(scripts/ci/next-version.sh "$GITHUB_SHA")"
          scripts/ci/release-notes.sh "$GITHUB_SHA" >notes.md
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes-file notes.md
          { echo "### Released $VERSION"; cat notes.md; } >>"$GITHUB_STEP_SUMMARY"
