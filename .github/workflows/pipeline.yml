# Merge to dev: CI, build once, apply to dev. No manual run needed.
# Prod only changes when a release PR merges dev into main (release.yml), and it
# gets this same build. There is no prod plan preview here: the prod role only
# trusts main, so a run on dev can't read prod.
name: Dev pipeline

on:
  push:
    branches: [dev]

permissions:
  contents: read
  id-token: write # only used in OIDC mode

concurrency:
  group: dev-pipeline
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  build:
    needs: ci
    uses: ./.github/workflows/_build.yml
  dev:
    needs: build
    uses: ./.github/workflows/_deploy.yml
    with:
      env: dev
      build_sha: ${{ needs.build.outputs.build_sha }}
