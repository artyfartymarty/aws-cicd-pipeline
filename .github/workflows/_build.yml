# Shared template: package the app once and store it as builds/<sha>/app.zip.
# Stand-in for publishing to JFrog. A build that already exists is never overwritten.
name: build (template)

on:
  workflow_call:
    outputs:
      build_sha:
        description: Commit SHA that identifies this build
        value: ${{ jobs.build.outputs.build_sha }}

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["self-hosted","aws"]') }}
    outputs:
      build_sha: ${{ steps.meta.outputs.sha }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      # OIDC mode (Yield sandbox): GitHub-hosted runner signs in as the base CI role.
      # In ec2 mode AWS_CI_ROLE_ARN is unset and the runner's instance role is used.
      - name: Sign in to AWS with OIDC
        if: vars.AWS_CI_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: meta
        run: echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      # Same script as bitbucket-pipelines.yml.
      - name: Package and upload
        run: scripts/ci/build.sh
        env:
          BUILD_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_number }}
          ACTOR: ${{ github.actor }}
          SUMMARY_FILE: ${{ github.step_summary }}
