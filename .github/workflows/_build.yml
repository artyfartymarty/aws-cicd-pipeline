# Shared template: package the app once and store it as builds/<sha>/app.zip.
# Stand-in for publishing to JFrog. A build that already exists is never overwritten.
name: build (template)

on:
  workflow_call:
    outputs:
      build_sha:
        description: Commit SHA that identifies this build
        value: ${{ jobs.build.outputs.build_sha }}

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["self-hosted","aws"]') }}
    outputs:
      build_sha: ${{ steps.meta.outputs.sha }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      # OIDC mode (Yield sandbox): GitHub-hosted runner signs in as the base CI role.
      # In ec2 mode AWS_CI_ROLE_ARN is unset and the runner's instance role is used.
      - name: Sign in to AWS with OIDC
        if: vars.AWS_CI_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: meta
        run: echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Package and upload
        run: |
          KEY="builds/$GITHUB_SHA/app.zip"
          if aws s3api head-object --bucket "$ARTIFACT_BUCKET" --key "$KEY" >/dev/null 2>&1; then
            echo "Build $GITHUB_SHA already exists, reusing it."
            exit 0
          fi
          mkdir -p dist
          (cd app/src && zip -qr -X ../../dist/app.zip . -x '__pycache__/*')
          aws s3api put-object --bucket "$ARTIFACT_BUCKET" --key "$KEY" --body dist/app.zip \
            --metadata "branch=$GITHUB_REF_NAME,run=$GITHUB_RUN_NUMBER,actor=$GITHUB_ACTOR" >/dev/null
          echo "### Build \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Uploaded s3://$ARTIFACT_BUCKET/$KEY from \`$GITHUB_REF_NAME\`" >> "$GITHUB_STEP_SUMMARY"
